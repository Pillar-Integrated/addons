name: "Pillar Supervisor"
description: "Manages Pillar's integrations and components"
image: "ghcr.io/pillar-integrated/pillar-supervisor"
version: "1.2.4"
hassio_api: true
hassio_role: manager
homeassistant_api: true
init: false
map:
    - homeassistant_config:rw
    - data:rw
slug: "pillar_supervisor"
startup: services
boot: auto
arch:
    - aarch64
    - amd64
options:
    restart_delay: 30
    auto_restart: true
schema:
    restart_delay: int(0,3600)
    auto_restart: bool
